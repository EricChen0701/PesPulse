<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetPulse OS - 寵物急診實時掛號</title>
    <!-- Tailwind CSS 4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
            --color-clinical-white: #FAFAFA;
            --color-core-blue: #2563EB;
            --color-natural-text: #1A1A1A;
        }
        body {
            background-color: var(--color-clinical-white);
            color: var(--color-natural-text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }
        .natural-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08), 0 4px 12px -4px rgba(0, 0, 0, 0.04);
        }
        .blue-shadow {
            box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.2);
        }
        .notch {
            width: 128px;
            height: 24px;
            background: white;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            border: 1px solid #f9fafb;
            border-top: none;
            z-index: 50;
        }
        /* Mobile adjustment */
        @media (max-width: 640px) {
            .app-container {
                min-height: 100vh;
                width: 100%;
                max-width: 100%;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body class="flex justify-center items-start sm:py-8">

    <div id="app" class="app-container w-full max-w-md bg-white min-h-[800px] relative overflow-hidden shadow-2xl sm:rounded-[40px] flex flex-col">
        <div class="notch hidden sm:block"></div>

        <!-- Start View -->
        <div id="view-input" class="view p-8 pt-16 space-y-6 flex-1 hidden">
            <div class="flex justify-between items-center mb-8">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-[#2563EB] rounded-full animate-pulse"></div>
                    <span class="text-[12px] font-bold tracking-widest text-[#2563EB] uppercase">PetPulse OS</span>
                </div>
                <span class="text-[11px] font-medium text-gray-400">MVP V1.0 (Static)</span>
            </div>

            <div class="space-y-2">
                <h1 class="text-3xl font-bold leading-tight">您的寵物有什麼<br/>緊急狀況？</h1>
                <p class="text-sm text-gray-500">AI 將即時分析嚴重程度並為您保留席位</p>
            </div>

            <div class="relative group">
                <textarea id="symptom-input" placeholder="描述症狀 (如：貓咪誤食異物、呼吸困難...)" 
                  class="w-full h-48 p-6 rounded-3xl bg-gray-50 border border-gray-100 natural-shadow focus:bg-white focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all outline-none text-lg resize-none italic text-gray-600 placeholder:text-gray-300"></textarea>
                
                <div class="absolute bottom-4 right-4 flex space-x-3">
                    <button id="btn-analyze" class="w-12 h-12 bg-[#2563EB] text-white rounded-full flex items-center justify-center shadow-lg blue-shadow active:scale-95 transition-all">
                        <i data-lucide="chevron-right" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-4">
                <div class="p-4 bg-white rounded-2xl border border-gray-50 shadow-sm flex flex-col space-y-2">
                    <i data-lucide="clock" class="text-[#2563EB] w-5 h-5"></i>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">即時分配</span>
                    <p class="text-xs font-semibold">180s 資源鎖定</p>
                </div>
                <div class="p-4 bg-white rounded-2xl border border-gray-50 shadow-sm flex flex-col space-y-2">
                    <i data-lucide="activity" class="text-green-500 w-5 h-5"></i>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">智慧分流</span>
                    <p class="text-xs font-semibold">Gemini 1.5 Flash</p>
                </div>
            </div>
            
            <div class="pt-8">
                <button id="btn-settings" class="text-[10px] text-gray-400 flex items-center gap-1 hover:text-gray-600">
                    <i data-lucide="settings" class="w-3 h-3"></i> 設定 API KEY
                </button>
            </div>
        </div>

        <!-- Analyzing View -->
        <div id="view-analyzing" class="view flex-1 flex flex-col items-center justify-center py-32 space-y-8 hidden">
            <div class="relative animate-spin-slow">
                <div class="w-24 h-24 border-4 border-blue-100 rounded-[32px] flex items-center justify-center">
                    <i data-lucide="loader-2" class="w-10 h-10 text-[#2563EB] animate-spin"></i>
                </div>
            </div>
            <div class="text-center space-y-3">
                <h2 class="text-2xl font-bold">正在鎖定資源...</h2>
                <p class="text-sm text-gray-400 max-w-[200px] mx-auto leading-relaxed">正在評估病情並尋找最近的可用診所</p>
            </div>
        </div>

        <!-- Results View -->
        <div id="view-results" class="view flex-1 p-8 pt-16 space-y-6 pb-24 hidden overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <button onclick="app.showInput()" class="w-10 h-10 bg-white shadow-sm border border-gray-50 rounded-full flex items-center justify-center text-gray-400">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 bg-[#2563EB] rounded-full"></div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em]">緊急分析報告</span>
                </div>
            </div>

            <div id="analysis-card" class="bg-white p-6 rounded-[32px] natural-shadow border border-gray-50/50">
               <!-- Dynamic Content -->
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between px-2">
                    <h3 class="font-bold text-lg">智能匹配最近診所</h3>
                    <span class="flex items-center gap-1.5 text-[10px] font-bold text-green-500 uppercase tracking-wider">
                      <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                      即時狀態盤點
                    </span>
                </div>
                <div id="clinics-list" class="space-y-3">
                     <!-- Clinics injected here -->
                </div>
            </div>

            <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md p-6 bg-gradient-to-t from-white via-white to-transparent z-40">
                <div class="bg-gray-900 text-white p-5 rounded-2xl flex items-center justify-between shadow-2xl">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center">
                            <i data-lucide="phone" class="text-white w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold uppercase tracking-wider text-gray-400">緊急協助專線</p>
                            <p class="font-mono text-sm">24H EMERGENCY</p>
                        </div>
                    </div>
                    <button class="bg-[#2563EB] px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg blue-shadow">立即撥打</button>
                </div>
            </div>
        </div>

        <!-- Locked View -->
        <div id="view-locked" class="view fixed inset-0 bg-white z-50 flex flex-col p-8 pt-16 hidden">
            <div class="flex-1 flex flex-col items-center justify-center space-y-12 max-w-md mx-auto w-full">
                <div class="text-center space-y-1">
                    <span class="text-[11px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-4 block">資源鎖定倒計時</span>
                    <span id="countdown" class="text-7xl font-mono font-bold text-[#2563EB] tracking-tighter">03:00</span>
                </div>

                <div class="w-full bg-gray-50 rounded-[40px] p-8 border border-gray-100 text-center space-y-4">
                    <div class="inline-flex items-center space-x-2 px-3 py-1 bg-green-50 text-green-700 rounded-full text-[10px] font-bold uppercase tracking-wider">
                        <i data-lucide="check-circle-2" class="w-3 h-3"></i>
                        <span>席位已鎖定</span>
                    </div>
                    <h2 id="locked-clinic-name" class="text-2xl font-bold">診所名稱</h2>
                    <p id="locked-clinic-address" class="text-[10px] text-gray-400 font-medium mb-2">門市地址</p>
                    <p class="text-sm text-gray-500 leading-relaxed px-4">系統已為您鎖定該診所資源。請於限時內抵達櫃檯。</p>
                </div>

                <div class="w-full space-y-4">
                    <button id="btn-navigate" class="w-full h-16 bg-[#2563EB] text-white rounded-2xl font-bold flex items-center justify-center space-x-3 text-lg shadow-xl blue-shadow">
                        <i data-lucide="map-pin" class="w-6 h-6"></i>
                        <span>開啟 Google 導航</span>
                    </button>
                    <div class="text-center">
                        <button onclick="app.showResults()" class="px-6 py-2 text-gray-400 font-medium text-xs uppercase tracking-widest hover:text-black">
                            放棄席位 (取消預約)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal (For API Key) -->
        <div id="modal-settings" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[100] flex items-center justify-center p-6 hidden">
            <div class="bg-white rounded-3xl p-8 w-full max-w-sm space-y-4">
                <h3 class="text-xl font-bold">API 設定</h3>
                <p class="text-sm text-gray-500">GitHub Pages 版需手動輸入您的 Gemini API Key (將儲存在瀏覽器中)</p>
                <input id="api-key-input" type="password" placeholder="貼上您的 API Key" class="w-full p-4 bg-gray-50 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex gap-3">
                    <button id="btn-save-key" class="flex-1 bg-[#2563EB] text-white p-3 rounded-xl font-bold">儲存</button>
                    <button onclick="document.getElementById('modal-settings').classList.add('hidden')" class="flex-1 bg-gray-100 p-3 rounded-xl font-bold">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
